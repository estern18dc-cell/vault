<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 0%, #13203a 0%, #0a0d13 60%);
    color: #e8ebf0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: 1.5rem 1rem;
  }
  form {
    width: min(360px, 100%);
    background: #11161f; border: 1px solid #222a38; border-radius: 14px;
    padding: 1.75rem 1.5rem 1.5rem;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .ic { width: 40px; height: 40px; border-radius: 10px; background: #1c2331; display: grid; place-items: center; margin-bottom: 1rem; }
  h1 { font-size: 1.15rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  p { color: #8b94a5; margin: 0 0 1.25rem; font-size: .88rem; }
  input[type=password] {
    width: 100%; font: inherit; color: inherit;
    background: #0a0d13; border: 1px solid #2e3848; border-radius: 9px;
    padding: .7rem .8rem; outline: none;
  }
  input[type=password]:focus { border-color: #3987e5; box-shadow: 0 0 0 3px rgba(57,135,229,.2); }
  label.rem { display: flex; align-items: center; gap: .5rem; color: #a1a9b8; font-size: .85rem; margin: .85rem 0 1.1rem; cursor: pointer; }
  button {
    width: 100%; font: inherit; font-weight: 600; color: #fff;
    background: #3987e5; border: 0; border-radius: 9px; padding: .7rem; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  .err { color: #ef5b5b; font-size: .85rem; margin-top: .75rem; min-height: 1.3em; }
</style>
</head>

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = a => btoa(String.fromCharCode(...a));
  const salt = b64(P.salt), iv = b64(P.iv), ct = b64(P.ct), tag = b64(P.tag);
  const STORE = 'pd-key';

  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: P.iter }, base, 512));
  }
  async function open(bits) {
    const mac = await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
    if (!await crypto.subtle.verify('HMAC', mac, tag, signed)) return null;

  }
  function show(html) { document.open(); document.write(html); document.close(); }

                  set(v) { try { localStorage.setItem(STORE, v); } catch (_) {} },
                  del() { try { localStorage.removeItem(STORE); } catch (_) {} } };

  // remembered device: the saved key only works for this exact build (tied to its salt)
  const saved = store.get();
  if (saved) {
    const [s, k] = saved.split(':');
    if (s === P.salt) open(b64(k)).then(h => h ? show(h) : store.del()).catch(() => store.del());

  }

  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = ''; go.disabled = true; go.textContent = 'Unlocking…';
    try {
      const bits = await derive(document.getElementById('pw').value);
      const html = await open(bits);
      if (!html) throw new Error('bad');
      if (document.getElementById('rem').checked) store.set(P.salt + ':' + toB64(bits));
      show(html);
    } catch (_) {
      err.textContent = 'Wrong password.';
      go.disabled = false; go.textContent = 'Unlock';
    }
  });
})();
